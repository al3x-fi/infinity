<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INFINITY — Coming Soon</title>
<meta name="description" content="Advanced liquidity management on Zero. Join the waitlist for early access.">
<meta property="og:title" content="INFINITY — Coming Soon">
<meta property="og:description" content="Advanced liquidity management on Zero. Join the waitlist for early access.">
<meta property="og:type" content="website">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icon.png">
<link rel="preload" as="image" href="logo-sm.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("infinity-theme")||"light"}catch(e){}</script>
<style>
:root{--bg:#fcfcfc;--panel:#fff;--line:#e5e5e5;--ink:#171717;--mute:#737373;--up:#16a34a}
:root[data-theme="dark"]{--bg:#0c0c0c;--panel:#141414;--line:#2a2a2a;--ink:#ededed;--mute:#8f8f8f;--up:#4ade80}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,sans-serif;font-weight:400;min-height:100vh;line-height:1.5;overflow-x:hidden}
.lines{position:absolute;left:0;right:0;top:0;height:460px;pointer-events:none;opacity:.55;background:repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 6px);-webkit-mask-image:radial-gradient(ellipse 60% 50% at 50% 60%,#000,transparent);mask-image:radial-gradient(ellipse 60% 50% at 50% 60%,#000,transparent)}
main{position:relative;max-width:640px;margin:0 auto;padding:40px 20px 64px;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:96px}
.top img{height:22px;filter:invert(1)}
:root[data-theme="dark"] .top img{filter:none}
.top a{color:var(--mute);font-size:14px;text-decoration:none}
.top a:hover{color:var(--ink)}
.eyebrow{letter-spacing:.3em;font-size:13px;color:var(--mute);margin-bottom:18px;text-transform:uppercase}
h1{font-size:clamp(38px,9vw,64px);line-height:1.05;letter-spacing:-.03em;font-weight:500;margin-bottom:18px}
p.sub{color:var(--mute);font-size:18px;font-weight:300;max-width:480px;margin:0 auto 32px}
form{display:flex;gap:8px;max-width:460px;margin:0 auto}
input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:13px 14px;border-radius:8px;font-size:16px;font-family:inherit}
input:focus{outline:1px solid var(--ink);border-color:var(--ink)}
button{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:13px 20px;font-size:15px;font-weight:500;font-family:inherit;cursor:pointer}
button:hover{opacity:.85}
button:disabled{opacity:.5;cursor:default}
.msg{color:#dc2626;font-size:14px;min-height:20px;margin-top:10px}
.done{max-width:460px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
.done h2{font-size:18px;font-weight:500;margin-bottom:4px}
.done h2::before{content:"✓ ";color:var(--up)}
.done p{color:var(--mute);font-size:15px}
.done a{display:inline-block;margin-top:14px;background:var(--ink);color:var(--bg);text-decoration:none;border-radius:8px;padding:11px 18px;font-weight:500;font-size:15px}
.hide{display:none}
footer{margin-top:96px;color:var(--mute);font-size:13px}
footer a{color:var(--ink)}
@media(max-width:520px){form{flex-direction:column}.top{margin-bottom:64px}}
</style>
</head>
<body>
<div class="lines"></div>
<main>
  <div class="top"><img src="logo-sm.png" alt="INFINITY" width="135" height="22"><a href="https://x.com/infinityZer0_">@infinityZer0_</a></div>
  <div class="eyebrow">Coming soon</div>
  <h1>Shape your liquidity.</h1>
  <p class="sub">Advanced liquidity management on Zero. Join the waitlist and be first to get access.</p>

  <section id="join">
    <form id="form">
      <input id="email" type="email" placeholder="you@email.com" required autocomplete="email" aria-label="Email">
      <button id="btn">Join waitlist</button>
    </form>
    <div class="msg" id="err" role="alert"></div>
  </section>

  <section id="done" class="hide">
    <div class="done">
      <h2>You're on the list</h2>
      <p>We'll email you when INFINITY opens up. Follow along on X for updates.</p>
      <a href="https://x.com/infinityZer0_" target="_blank" rel="noopener">Follow @infinityZer0_</a>
    </div>
  </section>

  <footer>© <span id="yr"></span> INFINITY</footer>
</main>

<script>
const $ = id => document.getElementById(id);
$("yr").textContent = new Date().getFullYear();
const showDone = () => { $("join").classList.add("hide"); $("done").classList.remove("hide"); };
try { if (localStorage.getItem("infinity-joined")) showDone(); } catch(_) {}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("email").value.trim().toLowerCase();
  if (!/^\S+@\S+\.\S+$/.test(email)) { $("err").textContent = "Enter a valid email."; return; }
  $("err").textContent = ""; $("btn").disabled = true;
  try {
    const own = /(^|\.)infinity0\.xyz$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);
    const r = await fetch(own ? "/api/join" : "https://infinity0.xyz/api/join", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email }) });
    if (!r.ok) throw new Error(r.status);
    try { localStorage.setItem("infinity-joined", "1"); } catch(_) {}
    showDone();
  } catch (_) {
    $("err").textContent = "Something went wrong. Please try again.";
    $("btn").disabled = false;
  }
});
</script>
</body>
</html>
